[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadharvest"
version = "1.0.0"
description = "B2B lead collection, enrichment and export — dirty lists in, verified Excel out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LeadHarvest contributors" }]
keywords = ["lead-generation", "b2b", "enrichment", "csv", "excel", "python"]
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
leadharvest = "leadharvest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
